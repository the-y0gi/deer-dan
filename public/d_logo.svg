<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="black"/>

  <!-- Left Antler -->
  <path
    d="M360 250
       C300 170,290 110,330 60
       C290 95,270 150,275 210
       C240 180,215 170,195 170
       C225 185,245 210,255 240
       C220 235,190 220,170 195
       C175 230,200 260,245 275
       C285 290,315 315,340 360"
