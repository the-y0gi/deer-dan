    stroke="white"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right Antler -->
  <path
    d="M440 250
       C500 170,510 110,470 60
       C510 95,530 150,525 210
       C560 180,585 170,605 170
       C575 185,555 210,545 240
       C580 235,610 220,630 195
       C625 230,600 260,555 275
       C515 290,485 315,460 360"
    fill="none"
    stroke="white"
    stroke-width="22"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Horns -->
  <path
    d="M390 360 C350 310,350 260,390 220"
    fill="none"
