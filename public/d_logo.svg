  />

  <!-- Head -->
  <path
    d="M400 350
       C340 360,320 430,345 500
       C360 550,380 600,400 630
       C420 600,440 550,455 500
       C480 430,460 360,400 350 Z"
    fill="white"
  />

  <!-- Faceted Face -->
  <path
    d="M400 350 L370 430 L400 500 L430 430 Z"
    fill="#f2f2f2"
  />

  <path
    d="M345 500 L400 500 L380 585 Z"
    fill="#e8e8e8"
  />

  <path
    d="M455 500 L400 500 L420 585 Z"
